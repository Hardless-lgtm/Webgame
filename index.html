<!DOCTYPE html>
<!-- #region CONFIGURAÇÃO DO DOCUMENTO -->
<!-- Define o idioma da página para leitores de tela e ferramentas do navegador. -->
<html lang="pt-BR">

<!-- Configura codificação, título e arquivo de estilos. -->
<head>
    <meta charset="UTF-8"> <!-- Permite exibir corretamente caracteres como acentos. -->
    <title>Meu jogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- #endregion -->

<!-- #region INTERFACE DO JOGO -->
<!-- Contém o cenário, as interações e a interface de diálogo. -->
<body>
    <!-- Serve de referência para posicionar todos os elementos do jogo. -->
    <main id="jogo">
        <!-- JavaScript escolhe a imagem conforme o cenário atual. -->
        <img id="fundo" src="" alt="">

        <!-- Cada porta aparece no cenário indicado e leva ao destino configurado. -->
        <button
            id="porta_cozinha"
            data-cenario="quarto"
            data-destino="cozinha">
            Porta
        </button>

        <button
            id="porta_cozinha_fora"
            data-cenario="fora"
            data-destino="cozinha">
            Porta
        </button>

        <button
            id="porta_quarto"
            data-cenario="cozinha"
            data-destino="quarto">
            Porta
        </button>

        <button
            id="porta_fora"
            data-cenario="cozinha"
            data-destino="fora">
            Porta
        </button>

        <!-- NPC interativo que aparece normalmente no cenário da cozinha. -->
        <div
            id="personagem"
            data-tipo="personagem"
            data-cenario="cozinha">
            NPC
        </div>

        <!-- Escurece o cenário ao iniciar uma conversa. -->
        <div id="filtro-dialogo"></div>

        <!-- Representação do protagonista usada durante os diálogos. -->
        <div id="protagonista-dialogo">
            Protagonista
        </div>

        <!-- Representação ampliada do NPC, exibida durante os diálogos. -->
        <div id="personagem-dialogo">
            NPC
        </div>

        <!-- Caixa inicialmente escondida; o JavaScript preenche e exibe suas falas. -->
        <div id="dialogo" style="display: none;">
            <!-- Nome e texto da fala atual são preenchidos pelo JavaScript. -->
            <h3 id="remetente"></h3>
            <p id="conteudo-dialogo"></p>
            <button id="continuar-dialogo">
                Continuar
            </button>
        </div>
    </main>

    <!-- Carrega o código que controla cenários, portas e diálogos. -->
    <script src="script.js"></script>
</body>
<!-- #endregion -->
</html>
